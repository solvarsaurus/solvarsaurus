name: activity chart
on:
  schedule:
    - cron: "0 3 * * *"   # daily 00:00 Brasilia time (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/github-candles/**"
      - ".github/workflows/chart.yml"
permissions:
  contents: write
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          test -n "$GH_TOKEN"   # without a token the script draws sample data
          MODE=daily OUT=chart-daily.svg python tools/github-candles/generate_chart.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart-daily.svg
          git diff --cached --quiet || git commit -m "chart: $(date +%F)"
          git push
